<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <link rel="stylesheet" href="leaflet/leaflet.css"/>
  <script>window.L_DISABLE_3D = true;</script>
  <script src="leaflet/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #F5F2E7; }
    #map { width: 100%; height: 100%; }
    .map-tile-controls {
      position: fixed; z-index: 10000; top: 12px; right: 12px;
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.95); padding: 6px 10px; border-radius: 8px;
      font: 13px system-ui, sans-serif; box-shadow: 0 1px 6px rgba(0,0,0,.15);
    }
    .tile-label { color: #3E2723; margin-right: 4px; font-weight: 600; }
    .tile-btn {
      cursor: pointer; border: 1px solid #BDBDBD; background: #fff;
      color: #3E2723; padding: 4px 10px; border-radius: 6px; font: inherit;
    }
    .tile-btn:hover { background: #E8F5E9; }
    .tile-btn.active { background: #2D5A27; color: #fff; border-color: #2D5A27; }
    .tree-card { font-family: 'Segoe UI', sans-serif; min-width: 220px; max-width: 280px; }
    .tree-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px 10px 0 0; display: block; }
    .tree-card .body { padding: 10px 12px 12px; }
    .tree-card h3 { margin: 0 0 6px; font-size: 16px; color: #2D5A27; }
    .tree-card .coord { font-size: 12px; color: #555; margin-bottom: 4px; }
    .tree-card .status { font-size: 12px; font-weight: bold; color: #3C2F2F; }
    #offlineNotice {
      display: none; position: fixed; z-index: 10001; bottom: 28px; left: 50%; transform: translateX(-50%);
      max-width: 560px; padding: 8px 14px; border-radius: 8px;
      background: rgba(61,40,20,0.9); color: #fff8e7; font: 12px/1.5 system-ui, sans-serif;
      pointer-events: none; text-align: center;
    }
  .map-tile-controls{left:54px;right:auto;max-width:calc(100% - 64px);flex-wrap:wrap;border-radius:10px}
    input,select{border:1px solid #dbe2dc;padding:6px;border-radius:6px;color:#213c2f;background:white}
    .legend{position:absolute;bottom:18px;right:12px;z-index:1000;background:white;padding:8px 12px;border-radius:8px;font:12px 'Segoe UI',sans-serif}
    </style>
</head>
<body>
<div id="map"></div>
<div class="legend"><b style="color:#4f772d">●</b> Healthy &nbsp; <b style="color:#457b9d">●</b> Monitoring &nbsp; <b style="color:#bc6c25">●</b> At Risk &nbsp; <b style="color:#9d2235">●</b> Destroyed</div>
<div id="mapTileControls" class="map-tile-controls">
  <label><input id="search" type="search" placeholder="Search the forest" aria-label="Search by species or ID"></label>
  <span id="count" aria-live="polite"></span>
  <select id="status" aria-label="Filter tree status"><option value="">All</option><option>Healthy</option><option>Monitoring</option><option>At Risk</option><option>Destroyed</option></select>
  <button type="button" id="btnTilesOnline" class="tile-btn">Online</button>
  <button type="button" id="btnTilesOffline" class="tile-btn">Offline</button>
</div>
<div id="offlineNotice">
  Offline tiles cover <strong>Baguio and surrounding areas</strong> only.
</div>
<script>
(function () {
  var records = [];
  var map = null, markers = [], tileLayer = null, _mapReady = false, _cfg = {};

  /* ---- Sizing: Java passes explicit w/h, or we measure ourselves ---- */
  var _javaW = 0, _javaH = 0;
  window._setContainerSize = function (w, h) { _javaW = w; _javaH = h; applySize(); };

  function applySize() {
    var el = document.getElementById('map');
    if (!el) return;
    var w = _javaW > 10 ? _javaW : (window.innerWidth || document.documentElement.clientWidth || 800);
    var h = _javaH > 10 ? _javaH : (window.innerHeight || document.documentElement.clientHeight || 600);
    if (w < 50) w = 800;
    if (h < 50) h = 600;
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    if (map) map.invalidateSize({ pan: false });
  }

  var _inv = null;
  function scheduleMapInvalidate() {
    if (_inv) clearTimeout(_inv);
    _inv = setTimeout(function () {
      _inv = null;
      applySize();
      requestAnimationFrame(applySize);
      setTimeout(applySize, 150);
      setTimeout(applySize, 500);
    }, 10);
  }
  window.scheduleMapInvalidate = scheduleMapInvalidate;
  window.invalidateMap = applySize;
  window.addEventListener('resize', scheduleMapInvalidate);

  /* ---- Wait for container to have real dimensions before creating map ---- */
  function containerReady() {
    var w = _javaW > 10 ? _javaW : (window.innerWidth || 0);
    var h = _javaH > 10 ? _javaH : (window.innerHeight || 0);
    return w > 50 && h > 50;
  }

  function waitForSizeThenInit() {
    if (containerReady()) { doInit(); }
    else { setTimeout(waitForSizeThenInit, 60); }
  }

  /* ---- Tiles ---- */
  function offlineRasterLayer(c) {
    return L.tileLayer((c && c.tileUrlTemplate) || 'tiles/{z}/{x}/{y}.png', {
      maxZoom: 18, minZoom: 0,
      attribution: 'Offline &copy; OpenStreetMap',
      errorTileUrl: (c && c.greyTileUrl) || 'leaflet/grey_tile.png'
    });
  }
  function createOnlineTileLayer() {
    return L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, keepBuffer: 4, updateWhenIdle: false, attribution: '&copy; OpenStreetMap'
    });
  }

  /* ---- Helpers ---- */
  function statusColor(st) {
    var s = (st || '').toLowerCase();
    if (s.indexOf('healthy') >= 0) return '#4F772D';
    if (s.indexOf('monitor') >= 0) return '#457B9D';
    if (s.indexOf('risk') >= 0) return '#BC6C25';
    if (s.indexOf('destroy') >= 0) return '#9D2235';
    return '#6B8E23';
  }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function cardHtml(t) {
    var img = t.imageDataUrl
      ? '<img src="' + t.imageDataUrl + '" alt=""/>'
      : '<div style="height:100px;background:#E8E4D8;border-radius:10px 10px 0 0;"></div>';
    return '<div class="tree-card">' + img +
      '<div class="body"><h3>' + esc(t.species || '') + '</h3>' +
      '<div class="coord">' + esc(t.id > 0 ? 'ID: ' + t.id : '') + '</div>' +
      '<div class="coord">' + esc(t.locationLabel || '') + '</div>' +
      '<div class="status">' + esc(t.status || '') + '</div><p>Height: ' + esc(t.height) + ' m · Diameter: ' + esc(t.diameter) + ' cm</p><p>Planted: ' + esc(t.planted || 'Unknown') + '</p><p>' + esc(t.notes || '') + '</p></div></div>';
  }

  /* ---- Map creation ---- */
  function doInit() {
    if (_mapReady) return;
    _mapReady = true;
    var c = _cfg;
    applySize();
    map = L.map('map', {
      zoomControl: true, worldCopyJump: true,
      fadeAnimation: false, markerZoomAnimation: false, zoomAnimation: false, tap: true
    }).setView([c.lat || 16.3933, c.lon || 120.5960], c.zoom || 13);

    function setOffline(off, persist) {
      if (tileLayer) map.removeLayer(tileLayer);
      tileLayer = off ? offlineRasterLayer(c) : createOnlineTileLayer();
      tileLayer.addTo(map);
      var bOn = document.getElementById('btnTilesOnline'), bOff = document.getElementById('btnTilesOffline');
      if (bOn) bOn.classList.toggle('active', !off);
      if (bOff) bOff.classList.toggle('active', off);
      var n = document.getElementById('offlineNotice');
      if (n) n.style.display = off ? 'block' : 'none';
      if (persist && window.javaMapPrefs) { try { window.javaMapPrefs.setOfflineTiles(off); } catch (e) {} }
      scheduleMapInvalidate();
    }
    document.getElementById('search').oninput = drawRecords;
    document.getElementById('status').onchange = drawRecords;
    document.getElementById('btnTilesOnline').onclick = function () { setOffline(false, true); };
    document.getElementById('btnTilesOffline').onclick = function () { setOffline(true, true); };
    setOffline(Boolean(c.offlineTiles), false);
    drawRecords();
    [0, 50, 200, 500, 1000, 2000].forEach(function (d) { setTimeout(applySize, d); });
  }

  /* ---- Public API ---- */
  window.initFieldMap = function (c) {
    _cfg = c || {};
    if (typeof c.containerW === 'number') _javaW = c.containerW;
    if (typeof c.containerH === 'number') _javaH = c.containerH;
    waitForSizeThenInit();
  };

  window.loadTreesFromB64 = function (b64) {
    try {
      var bytes = Uint8Array.from(atob(b64), function(c) { return c.charCodeAt(0); });
      records = JSON.parse(new TextDecoder().decode(bytes));
    } catch(e) { return; }
    drawRecords();
  };
  function drawRecords() {
    if (!map) return;
    markers.forEach(function (m) { map.removeLayer(m); });
    markers = [];
    var q = document.getElementById('search').value.trim().toLowerCase().replace(/^#/, '');
    var status = document.getElementById('status').value;
    var trees = records.filter(function(t) { return (!status || t.status === status) && (String(t.id).includes(q) || t.species.toLowerCase().includes(q)); });
    document.getElementById('count').textContent = trees.length + (trees.length === 1 ? ' tree' : ' trees');
    if (!trees || !trees.length) return;
    var bounds = [];
    trees.forEach(function (t) {
      var col = statusColor(t.status);
      var icon = L.divIcon({
        className: '',
        html: '<div style="width:14px;height:14px;border-radius:50%;background:' + col + ';border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);"></div>',
        iconSize: [18, 18], iconAnchor: [9, 9]
      });
      var m = L.marker([t.lat, t.lon], { icon: icon }).addTo(map);
      m.bindPopup(cardHtml(t), { closeButton: true, offset: [0, -12], autoPan: true });
      markers.push(m);
      bounds.push([t.lat, t.lon]);
    });
    if (bounds.length === 1) map.setView(bounds[0], 15);
    else if (bounds.length > 1) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
    scheduleMapInvalidate();
  };
})();
</script>
</body>
</html>
